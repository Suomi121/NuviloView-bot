name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-quorum-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: quorum_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nuviloview_quorum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quorum_test -d nuviloview_quorum_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_COORDINATOR_DATABASE_URL: postgresql://quorum_test:isolated-ci-only@127.0.0.1:5432/nuviloview_quorum_test
      TEST_COORDINATOR_ISOLATED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/multi-db-coordinator.test.mjs tests/multi-db-security.test.mjs tests/multi-db-postgres.test.mjs tests/hybrid-*.test.mjs
      - name: Restart isolated PostgreSQL service (never Production)
        run: |
          docker restart "${{ job.services.postgres.id }}"
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U quorum_test -d nuviloview_quorum_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify persisted consensus after actual database restart
        run: node --test tests/hybrid-restart-postgres.test.mjs
        env:
          TEST_HYBRID_RESTART: "1"
      - name: Custom-format backup and isolated fresh database restore
        run: |
          container="${{ job.services.postgres.id }}"
          docker exec "$container" pg_dump -U quorum_test -d nuviloview_quorum_test -Fc -f /tmp/hybrid-isolated.dump
          docker exec "$container" createdb -U quorum_test nuviloview_hybrid_restore_test
          docker exec "$container" pg_restore -U quorum_test --exit-on-error --no-owner --no-privileges -d nuviloview_hybrid_restore_test /tmp/hybrid-isolated.dump
          source_hash=$(docker exec "$container" psql -U quorum_test -d nuviloview_quorum_test -Atc "SELECT md5(string_agg(checksum, ',' ORDER BY guild_id,slot)) FROM neon.mdb_acceptor")
          restored_hash=$(docker exec "$container" psql -U quorum_test -d nuviloview_hybrid_restore_test -Atc "SELECT md5(string_agg(checksum, ',' ORDER BY guild_id,slot)) FROM neon.mdb_acceptor")
          test -n "$source_hash"
          test "$source_hash" = "$restored_hash"
          source_count=$(docker exec "$container" psql -U quorum_test -d nuviloview_quorum_test -Atc "SELECT count(*) FROM legacy.guild_quorum_transfer WHERE state='complete'")
          restored_count=$(docker exec "$container" psql -U quorum_test -d nuviloview_hybrid_restore_test -Atc "SELECT count(*) FROM legacy.guild_quorum_transfer WHERE state='complete'")
          test "$source_count" = "1"
          test "$source_count" = "$restored_count"
      - name: Bounded 100 Guild and 16000 revision failure load
        run: node --test tests/hybrid-load.test.mjs
        env:
          HYBRID_STRESS: "1"

  spam-command-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: spam_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nuviloview_spam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spam_test -d nuviloview_spam_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_SPAM_DATABASE_URL: postgresql://spam_test:isolated-ci-only@127.0.0.1:5432/nuviloview_spam_test
      TEST_SPAM_ISOLATED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test actual Spam command handler and PostgreSQL persistence
        run: node --test tests/spam-command-runtime.test.mjs tests/spam-command-postgres.test.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/nuviloview_ci
      BETTER_AUTH_SECRET: ci-only-placeholder-not-a-production-secret
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      GUILD_RESET_ENABLED: "false"
      NUVILOVIEW_DISTRIBUTED_SINGLETON: "false"
      MESSAGE_HISTORY_IMPORT_V2_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use locked pnpm version
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration manifest
        run: pnpm run migration:validate

      - name: Guard production feature baseline
        run: node scripts/production-contract.mjs

      - name: Focused production regression gates (no live services)
        run: >-
          node --test tests/auth-*.test.mjs tests/account-*.test.mjs
          tests/social-login-rate-limit.test.mjs tests/security-navigation-link.test.mjs
          tests/guild-spam-*.test.mjs tests/spam-protection.test.mjs
          tests/guild-onboarding.test.mjs tests/worker-supervisor.test.mjs
          tests/sync-worker.test.mjs tests/runtime-*.test.mjs tests/multi-db-sync.test.mjs

      - name: Check static schema drift
        run: pnpm run migration:drift:static

      - name: Scan repository for token leaks
        run: pnpm run security:tokens

      - name: Check JavaScript module syntax
        run: pnpm run syntax:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Check critical production dependency advisories
        run: pnpm run dependency:audit

      - name: Build
        run: pnpm run build

      - name: Verify built production routes
        run: node scripts/production-contract.mjs --build

  auth-identity-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nuviloview_auth_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d nuviloview_auth_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_AUTH_IDENTITY_DATABASE_URL: postgresql://auth_test:isolated-ci-only@127.0.0.1:5432/nuviloview_auth_identity_test
      TEST_AUTH_IDENTITY_ISOLATED: "1"
      AUTH_IDENTITY_STRESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Auth identity migration and parallel OAuth callbacks
        run: pnpm run test:auth:postgres
